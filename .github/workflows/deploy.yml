name: deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

# main deploys production (moneysight.app + admin.moneysight.app, image tag "latest"); develop deploys the dev
# stack (dev.moneysight.app, image tag "develop").
env:
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'develop' }}
  STACK_DIR: ${{ github.ref_name == 'main' && '/home/projects/budget-app' || '/home/projects/budget-app-dev' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit and the base images come through mirror.gcr.io: anonymous Docker Hub pulls from
      # runners get rate limited (429) or time out.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
    steps:
      - name: Checkout code
        if: env.DEPLOY_SSH_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: webfactory/ssh-agent@v0.10.0
        if: env.DEPLOY_SSH_KEY != ''
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Ship the stack files and deploy on the VPS
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          scp -o StrictHostKeyChecking=accept-new deploy/docker-compose.yml deploy/deploy.sh "$DEPLOY_TARGET:$STACK_DIR/"
          # Backs up the database, migrates and health-checks; rolls back to the previous image on failure.
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_TARGET" "sh $STACK_DIR/deploy.sh"

      - name: Skipped (deploy secrets missing)
        if: env.DEPLOY_SSH_KEY == ''
        run: echo "::warning::DEPLOY_SSH_KEY, DEPLOY_SSH_USER and DEPLOY_SSH_HOST are not set; the image was pushed but not deployed."
