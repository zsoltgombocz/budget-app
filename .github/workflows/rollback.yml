name: rollback

# Runs an earlier image on a stack: every build is also tagged with its commit SHA.
# Database migrations are not undone; deploy.sh keeps the last 14 database backups in
# <stack>/backups for a manual restore.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Stack to roll back
        type: choice
        options:
          - production
          - dev
        default: production
      sha:
        description: Full commit SHA of the version to run (see the build job tags)
        type: string
        required: true

concurrency:
  group: deploy-${{ inputs.target == 'production' && 'main' || 'develop' }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    env:
      STACK_DIR: ${{ inputs.target == 'production' && '/home/projects/budget-app' || '/home/projects/budget-app-dev' }}
      SHA: ${{ inputs.sha }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
    steps:
      - name: Check the SHA
        run: echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Give the full 40 character commit SHA."; exit 1; }

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Run the earlier image
        run: ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_TARGET" "sh $STACK_DIR/deploy.sh $SHA"
