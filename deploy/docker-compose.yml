# Stack on the VPS, copied there by the deploy workflow: production in /home/projects/budget-app,
# dev in /home/projects/budget-app-dev. The shared Caddy container (/opt/caddy) serves public/
# from the PUBLIC_VOLUME volume and forwards PHP requests to <STACK_NAME>:9000 on the external
# "caddy" network. STACK_NAME, IMAGE_TAG and PUBLIC_VOLUME come from the stack's .env; the
# defaults are production.
name: ${STACK_NAME:-budget-app}

x-app: &app
  image: ghcr.io/zsoltgombocz/budget-app:${IMAGE_TAG:-latest}
  volumes:
    - ./.env:/var/www/html/.env:ro
  networks:
    - internal
  depends_on:
    mariadb:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    container_name: ${STACK_NAME:-budget-app}
    volumes:
      - ./.env:/var/www/html/.env:ro
      - budget_app_public:/var/www/html/public
    networks:
      internal:
      caddy:
        aliases:
          - ${STACK_NAME:-budget-app}

  queue:
    <<: *app
    container_name: ${STACK_NAME:-budget-app}-queue
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    container_name: ${STACK_NAME:-budget-app}-scheduler
    user: www-data
    command: ["php", "artisan", "schedule:work"]

  # Server CPU, memory and disk for the Pulse dashboard.
  pulse:
    <<: *app
    container_name: ${STACK_NAME:-budget-app}-pulse
    user: www-data
    command: ["php", "artisan", "pulse:check"]

  mariadb:
    image: mariadb:11.4
    container_name: ${STACK_NAME:-budget-app}-mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mariadb_data:
  budget_app_public:
    external: true
    name: ${PUBLIC_VOLUME:-budget_app_public}

networks:
  internal:
  caddy:
    external: true
